<!doctype html>
<html lang="en">

  <body>
    <div class="container my-5">

            <div class="col-md-6">

                <p>
                    <label for="nombre">Nombre</label>
                    <input type="text" class="form-control mb-3" id="nombre" value="Matías">
                </p>
                <p>
                    <label for="apellido">Apellido</label>
                    <input type="text" class="form-control mb-3" id="apellido" value="Quinteros">

                <p>
                    <label for="apellido">Email</label>

                    <label for="apellido">Teléfono</label>

                <p>

                </p>
                <p>
                    <button class="btn btn-success" onclick="guardarDatos();">Guardar</button>
                    <button class="btn btn-primary" onclick="recuperarDatos();">Recuperar</button>
                    <button class="btn btn-danger" onclick="borrarDatos();">Borrar</button>

            </div>
        </div>
